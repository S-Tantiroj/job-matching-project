name: sync-candidates

on:
  # ============================================================================
  # ตารางเวลาถูกปิดไว้ตั้งแต่ 2026-09-10 — เปิดกลับเมื่อมีบัญชี PhantomBuster
  # ============================================================================
  # workflow นี้แดงติดกันสามคืน (8-10 ก.ย. 2026) เพราะ secret ของ PhantomBuster
  # ไม่เคยถูกตั้ง เนื่องจากยังไม่มีบัญชี — **มันไม่เคยทำงานสำเร็จเลยสักครั้ง**
  # ไม่ใช่ของที่เคยเขียวแล้วพัง
  #
  # **ปล่อยให้แดงทุกคืนแย่กว่าปิดไป** เพราะกากบาทแดงที่แก้ไม่ได้สอนให้คนเลิกสนใจ
  # กากบาทแดง วันที่มันแดงเพราะเรื่องจริงจะไม่มีใครทันสังเกต — หลักการเดียวกับ
  # tolerateOutage ในชุดเทสต์ integration ที่เขียนไว้ใน CLAUDE.md
  #
  # **วิธีเปิดกลับ** (ทำสองอย่าง ไม่ใช่อย่างเดียว)
  #   1. ตั้ง secret ทั้งสองตัวที่ Settings → Secrets and variables → Actions
  #      คือ PHANTOMBUSTER_API_KEY และ PHANTOMBUSTER_AGENT_ID
  #   2. เอาคอมเมนต์ออกจากสองบรรทัดใต้นี้
  #
  # ก่อนเปิดกลับ แนะนำให้กด "Run workflow" ด้วยมือหนึ่งครั้งเพื่อดูว่าเขียวจริง —
  # lib/ingest/phantombuster.ts ยังไม่เคยถูกยืนยันกับ API จริงเลย รูปร่าง endpoint
  # และ response อาจไม่ตรงกับที่เขียนไว้
  #
  # schedule:
  #   # GitHub ใช้ UTC ไม่ใช่เวลาไทย — 19:00 UTC = 02:00 ของวันถัดไปตามเวลากรุงเทพ
  #   # อย่าเปลี่ยนเป็น '0 2 * * *' เพราะนั่นคือ 09:00 เช้าตามเวลาไทย
  #   - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: sync-candidates
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/sync-phantombuster.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PHANTOMBUSTER_API_KEY: ${{ secrets.PHANTOMBUSTER_API_KEY }}
          PHANTOMBUSTER_AGENT_ID: ${{ secrets.PHANTOMBUSTER_AGENT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
